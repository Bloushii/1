<title>كروت الكاش باك</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&display=swap">
<style>
/* Layout: summary strip on top, entry form beside a grid of 14 card tiles, purchase log below */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #16202a;
  --muted: #5d6b78;
  --line: #dde3e9;
  --accent: #0f5c6e;
  --accent-soft: #e2f0f2;
  --good: #1d7a46;
  --warn: #b86a00;
  --bad: #b3261e;
  --track: #e6eaee;
  --f-display: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1418; --surface: #182027; --fg: #e6ecf1; --muted: #93a2ae; --line: #2a353f;
    --accent: #5cc2d4; --accent-soft: #163640; --good: #5ccf8b; --warn: #f0a640; --bad: #f08a80; --track: #26313a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1418; --surface: #182027; --fg: #e6ecf1; --muted: #93a2ae; --line: #2a353f;
  --accent: #5cc2d4; --accent-soft: #163640; --good: #5ccf8b; --warn: #f0a640; --bad: #f08a80; --track: #26313a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--f-display); font-size: 1.9rem; margin: 0; line-height: 1.2; text-wrap: balance; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: .9rem; }
h2 { font-size: 1.05rem; margin: 0; font-weight: 700; }
label { font-size: .82rem; color: var(--muted); font-weight: 500; }
select, input {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; width: 100%; min-width: 0;
}
select:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; }
button.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 600; }
button.link { border: 0; background: none; color: var(--accent); padding: 4px 6px; font-size: .85rem; }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: not-allowed; }

.month { display: flex; align-items: center; gap: 8px; }
.month select { width: auto; background: var(--surface); }

.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stat { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .k { font-size: .8rem; color: var(--muted); }
.stat .v { font-size: 1.5rem; font-weight: 700; }
.stat .v small { font-size: .8rem; font-weight: 500; color: var(--muted); }
.bigbar { grid-column: 1 / -1; background: var(--surface); padding: 0 16px 14px; }
.bar { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.full > i { background: var(--good); }
.bar.over > i { background: var(--bad); }

.main { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
form { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { border: 1px solid var(--line); border-radius: 8px; padding: 8px; text-align: center; color: var(--fg); font-size: .9rem; cursor: pointer; }
.seg input:checked + label { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.preview { font-size: .85rem; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 10px; }
.preview b { color: var(--fg); }
.preview .w { color: var(--warn); font-weight: 600; }
.msg { font-size: .85rem; min-height: 1.2em; }
.msg.err { color: var(--bad); }
.msg.ok { color: var(--good); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; text-align: start; }
.card:hover { border-color: var(--accent); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.card .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card .nm { font-weight: 600; overflow-wrap: anywhere; }
.card .l4 { font-size: .8rem; color: var(--muted); direction: ltr; letter-spacing: .06em; white-space: nowrap; }
.card .rem { font-size: 1.15rem; font-weight: 700; }
.card .rem small { font-size: .78rem; color: var(--muted); font-weight: 500; }
.pill { font-size: .72rem; padding: 2px 8px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
.pill.done { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.pill.over { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.pill.open { background: var(--accent-soft); color: var(--accent); }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 640px; }
th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: start; white-space: nowrap; }
th { font-size: .78rem; color: var(--muted); font-weight: 500; }
td.pos { color: var(--good); }
td.neg { color: var(--bad); }
.unsold { color: var(--warn); font-size: .82rem; }
.sellbox { display: inline-flex; gap: 4px; align-items: center; }
.sellbox input { width: 90px; padding: 4px 6px; }
.empty { color: var(--muted); padding: 18px 4px; text-align: center; }
.status { font-size: .82rem; color: var(--muted); }

@media (max-width: 860px) {
  .main { grid-template-columns: 1fr; }
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .3s ease; } }
</style>

<div class="wrap" dir="rtl" lang="ar">
  <header>
    <div>
      <h1>كروت الكاش باك</h1>
      <p class="sub">١٤ فيزا × ١٬٠٠٠ د.ك · كاش باك ١٠٪ لين الحد · يبدأ من نوفمبر ٢٠٢٦</p>
    </div>
    <div class="month">
      <label for="month">الشهر</label>
      <select id="month"></select>
    </div>
  </header>

  <section class="summary" aria-label="ملخص الشهر">
    <div class="stat"><span class="k">المصروف</span><span class="v" id="sSpent">0</span></div>
    <div class="stat"><span class="k">الباقي للشراء</span><span class="v" id="sLeft">14,000</span></div>
    <div class="stat"><span class="k">الكاش باك المتوقع</span><span class="v" id="sCb">0</span></div>
    <div class="stat"><span class="k">صافي الربح (المباع)</span><span class="v" id="sNet">0</span></div>
    <div class="bigbar"><div class="bar" id="sBar"><i style="width:0%"></i></div></div>
  </section>

  <div class="main">
    <section class="panel" aria-labelledby="addH">
      <h2 id="addH">سجّل شراء</h2>
      <form id="form" novalidate>
        <div class="field">
          <label for="fCard">الكرت</label>
          <select id="fCard" required></select>
        </div>
        <div class="row2">
          <div class="field"><label for="fQty">العدد</label><input id="fQty" type="number" min="1" step="1" value="1" inputmode="numeric"></div>
          <div class="field"><label for="fBuy">سعر الواحد (شراء)</label><input id="fBuy" type="number" min="0" step="0.001" inputmode="decimal" placeholder="مثلاً 480"></div>
        </div>
        <div class="field">
          <label for="fSell">سعر بيع الواحد (اختياري)</label>
          <input id="fSell" type="number" min="0" step="0.001" inputmode="decimal" placeholder="اتركه فاضي إذا بعدك ما بعت">
        </div>
        <div class="preview" id="preview">اختار كرت وحط السعر.</div>
        <button class="primary" type="submit" id="addBtn">إضافة</button>
        <div class="msg" id="msg" role="status"></div>
      </form>
    </section>

    <section class="panel" aria-labelledby="cardsH">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
        <h2 id="cardsH">الكروت</h2>
        <span class="status" id="cardsNote">اضغط على كرت عشان تختاره</span>
      </div>
      <div class="cards" id="cards"></div>
    </section>
  </div>

  <section class="panel" aria-labelledby="logH">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
      <h2 id="logH">المشتريات</h2>
      <span class="status" id="conn">جاري الاتصال…</span>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th></th><th>التاريخ</th><th>الكرت</th><th>العدد</th><th>شراء/جهاز</th><th>المجموع</th><th>بيع/جهاز</th><th>فرق البيع</th><th></th></tr></thead>
        <tbody id="log"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const LIMIT = 1000, RATE = 0.10, START = "2026-11";
const CARDS = [
  ["7757","امي"],["7509","انا"],["5813","خالتي"],["0946","علي"],["1954","فهد"],["8211","معصومة"],["5862","مريم"],
  ["5154","معصومة قمبر"],["1743","الفرحان"],["3243","حسين مقيم"],["4637","حسن القلاف"],["3741","جابر ولد عمتي"],
  ["4332","حمود ولد عمي عباس"],["6954","الاء"]
].map(([last4, name]) => ({ last4, name }));
const cardName = l4 => (CARDS.find(c => c.last4 === l4) || { name: l4 }).name;

const $ = id => document.getElementById(id);
const fmt = n => (Math.round(n * 1000) / 1000).toLocaleString("en-US", { maximumFractionDigits: 3 });
const AR_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const monthLabel = m => { const [y, mo] = m.split("-"); return AR_MONTHS[+mo - 1] + " " + y; };
const nextMonth = m => { let [y, mo] = m.split("-").map(Number); mo++; if (mo > 12) { mo = 1; y++; } return y + "-" + String(mo).padStart(2, "0"); };
const nowMonth = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };

let purchases = [];   // {id, month, card, qty, buy, sell|null, at}
let db = null, col = null, canWrite = true;
let month = nowMonth() < START ? START : nowMonth();
let pendingDelete = null;
let lastAdded = null;

function months() {
  const set = new Set(purchases.map(p => p.month));
  let m = START; const end = nextMonth(nowMonth() < START ? START : nowMonth());
  while (m <= end) { set.add(m); m = nextMonth(m); }
  set.add(month);
  return [...set].sort();
}
function renderMonths() {
  const sel = $("month"); const list = months();
  sel.innerHTML = list.map(m => `<option value="${m}" ${m === month ? "selected" : ""}>${monthLabel(m)}</option>`).join("");
}

function stats() {
  const ps = purchases.filter(p => p.month === month);
  const per = {};
  for (const c of CARDS) per[c.last4] = 0;
  for (const p of ps) per[p.card] = (per[p.card] || 0) + p.qty * p.buy;
  let spent = 0, cb = 0;
  for (const c of CARDS) { spent += per[c.last4]; cb += Math.min(per[c.last4], LIMIT) * RATE; }
  const sold = ps.filter(p => p.sell != null);
  const sellDiff = sold.reduce((a, p) => a + p.qty * (p.sell - p.buy), 0);
  const unsoldCount = ps.filter(p => p.sell == null).reduce((a, p) => a + p.qty, 0);
  return { ps, per, spent, cb, sellDiff, net: cb + sellDiff, unsoldCount };
}

function renderCards(s) {
  const selected = $("fCard").value;
  $("cards").innerHTML = CARDS.map(c => {
    const sp = s.per[c.last4], rem = LIMIT - sp, pct = Math.min(sp / LIMIT * 100, 100);
    const state = sp > LIMIT ? "over" : sp >= LIMIT ? "full" : "";
    const pill = sp > LIMIT ? `<span class="pill over">تجاوز ${fmt(sp - LIMIT)}</span>`
      : sp >= LIMIT ? `<span class="pill done">خلص</span>`
      : sp > 0 ? `<span class="pill open">مستخدم ${fmt(sp)}</span>` : "";
    return `<button type="button" class="card ${selected === c.last4 ? "sel" : ""}" data-card="${c.last4}">
      <div class="top"><span class="nm">${c.name}</span><span class="l4">•••• ${c.last4}</span></div>
      <div class="top"><span class="rem">${fmt(Math.max(rem, 0))} <small>باقي</small></span>${pill}</div>
      <div class="bar ${state}"><i style="width:${pct}%"></i></div>
    </button>`;
  }).join("");
}

function renderLog(s) {
  const rows = [...s.ps].sort((a, b) => (b.at || "").localeCompare(a.at || ""));
  if (!rows.length) {
    $("log").innerHTML = `<tr><td colspan="9" class="empty">ما في مشتريات مسجلة في ${monthLabel(month)}. سجّل أول شراء من النموذج.</td></tr>`;
    return;
  }
  $("log").innerHTML = rows.map(p => {
    const total = p.qty * p.buy;
    const d = p.at ? new Date(p.at).toLocaleDateString("en-GB", { day: "2-digit", month: "2-digit" }) : "";
    let sellCell, diffCell;
    if (p.sell == null) {
      sellCell = canWrite
        ? `<span class="sellbox"><input type="number" min="0" step="0.001" id="sell-${p.id}" aria-label="سعر البيع" placeholder="بعته بكم؟"><button class="link" data-sell="${p.id}">حفظ</button></span>`
        : `<span class="unsold">لم يُبع</span>`;
      diffCell = `<td class="unsold">—</td>`;
    } else {
      const diff = p.qty * (p.sell - p.buy);
      sellCell = fmt(p.sell);
      diffCell = `<td class="${diff >= 0 ? "pos" : "neg"}">${diff >= 0 ? "+" : ""}${fmt(diff)}</td>`;
    }
    const del = !canWrite ? "" : pendingDelete === p.id
      ? `<button class="link danger" data-del-yes="${p.id}">تأكيد الحذف</button><button class="link" data-del-no="1">إلغاء</button>`
      : `<button class="link danger" data-del="${p.id}">حذف</button>`;
    return `<tr><td>${del}</td><td>${d}</td><td>${cardName(p.card)} <span class="l4" style="color:var(--muted);font-size:.78rem">${p.card}</span></td>
      <td>${p.qty}</td><td>${fmt(p.buy)}</td><td>${fmt(total)}</td>
      <td>${sellCell}</td>${diffCell}</tr>`;
  }).join("");
}

function renderPreview(s) {
  const card = $("fCard").value, qty = +$("fQty").value || 0, buy = +$("fBuy").value || 0;
  const sellRaw = $("fSell").value;
  if (!card) { $("preview").textContent = "اختار كرت وحط السعر."; return; }
  const used = s.per[card] || 0, total = qty * buy, after = used + total;
  let html = `${cardName(card)}: مستخدم <b>${fmt(used)}</b> · بعد هالشراء <b>${fmt(after)}</b> · يبقى <b>${fmt(Math.max(LIMIT - after, 0))}</b>`;
  if (after > LIMIT) html += `<br><span class="w">تنبيه: راح يتجاوز الحد بـ ${fmt(after - LIMIT)} د.ك وهالزيادة ما عليها كاش باك.</span>`;
  if (sellRaw !== "" && buy) {
    const loss = qty * (buy - (+sellRaw));
    const cbGain = (Math.min(after, LIMIT) - Math.min(used, LIMIT)) * RATE;
    html += `<br>خسارة البيع <b>${fmt(loss)}</b> · كاش باك هالشراء <b>${fmt(cbGain)}</b> · الصافي <b>${fmt(cbGain - loss)}</b>`;
  }
  $("preview").innerHTML = html;
}

function render() {
  const s = stats();
  $("sSpent").innerHTML = `${fmt(s.spent)} <small>/ ${fmt(LIMIT * CARDS.length)}</small>`;
  $("sLeft").textContent = fmt(Math.max(LIMIT * CARDS.length - s.spent, 0));
  $("sCb").textContent = fmt(s.cb);
  $("sNet").innerHTML = `${fmt(s.net)}${s.unsoldCount ? ` <small>· ${s.unsoldCount} جهاز ما انباع</small>` : ""}`;
  $("sNet").style.color = s.net < 0 ? "var(--bad)" : s.net > 0 ? "var(--good)" : "";
  const bar = $("sBar"); bar.firstElementChild.style.width = Math.min(s.spent / (LIMIT * CARDS.length) * 100, 100) + "%";
  bar.className = "bar" + (s.spent >= LIMIT * CARDS.length ? " full" : "");
  renderMonths(); renderCards(s); renderLog(s); renderPreview(s);
}

function setMsg(t, kind) { $("msg").textContent = t; $("msg").className = "msg " + (kind || ""); }
const num = v => v === "" || v == null ? null : Number(v);

// Form setup
$("fCard").innerHTML = `<option value="">— اختار —</option>` + CARDS.map(c => `<option value="${c.last4}">${c.name} · ${c.last4}</option>`).join("");
["fCard","fQty","fBuy","fSell"].forEach(id => $(id).addEventListener("input", () => render()));
$("month").addEventListener("change", e => { month = e.target.value; pendingDelete = null; render(); });
$("cards").addEventListener("click", e => {
  const b = e.target.closest("[data-card]"); if (!b) return;
  $("fCard").value = b.dataset.card;
  const rem = LIMIT - (stats().per[b.dataset.card] || 0);
  render(); $("fBuy").focus();
  if (rem <= 0) setMsg("هالكرت خلص حده لهالشهر.", "err"); else setMsg("");
});

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const card = $("fCard").value, qty = Math.floor(+$("fQty").value), buy = num($("fBuy").value), sell = num($("fSell").value);
  if (!card) return setMsg("اختار الكرت.", "err");
  if (!(qty >= 1)) return setMsg("العدد لازم يكون ١ أو أكثر.", "err");
  if (!(buy > 0)) return setMsg("حط سعر شراء الجهاز.", "err");
  if (sell != null && !(sell >= 0)) return setMsg("سعر البيع غير صحيح.", "err");
  if (!col) return setMsg("الحفظ غير متاح الحين. افتح الصفحة من claude.ai وأنت مسجل دخول.", "err");
  const doc = { month, card, qty, buy, sell, at: new Date().toISOString() };
  $("addBtn").disabled = true;
  try {
    lastAdded = await col.add(doc);
    setMsg(`انضاف: ${qty} جهاز على كرت ${cardName(card)}.`, "ok");
    $("msg").insertAdjacentHTML("beforeend", ` <button type="button" class="link danger" id="undoBtn">تراجع</button>`);
    $("fBuy").value = ""; $("fSell").value = ""; $("fQty").value = "1";
  } catch (err) {
    setMsg(err && err.code === "invalid_argument" ? "ما عندك صلاحية تعديل." : "ما انحفظ، جرّب مرة ثانية.", "err");
  } finally { $("addBtn").disabled = false; }
});

$("msg").addEventListener("click", async e => {
  if (e.target.id !== "undoBtn" || !lastAdded) return;
  e.target.disabled = true;
  try { await lastAdded.delete(); lastAdded = null; setMsg("تم التراجع، انحذفت العملية.", "ok"); }
  catch { e.target.disabled = false; setMsg("ما قدرت أتراجع، احذفها من جدول المشتريات.", "err"); }
});

$("log").addEventListener("click", async e => {
  const t = e.target;
  if (t.dataset.del) { pendingDelete = t.dataset.del; render(); return; }
  if (t.dataset.delNo) { pendingDelete = null; render(); return; }
  if (t.dataset.delYes) {
    try { await col.doc(t.dataset.delYes).delete(); pendingDelete = null; } catch { setMsg("ما انحذف، جرّب مرة ثانية.", "err"); }
    return;
  }
  if (t.dataset.sell) {
    const v = num($("sell-" + t.dataset.sell).value);
    if (v == null || !(v >= 0)) return;
    try { await col.doc(t.dataset.sell).update({ sell: v }); } catch { setMsg("ما انحفظ سعر البيع.", "err"); }
  }
});

render();

(async () => {
  try {
    db = await window.claude?.use?.("db");
    const user = await window.claude?.use?.("user");
    if (user && user.can && (await user.can("data.write")) === false) canWrite = false;
  } catch {}
  if (!db) { $("conn").textContent = "الحفظ غير متاح هني، افتح الصفحة من claude.ai"; return; }
  col = db.collection("purchases");
  if (!canWrite) { $("addBtn").disabled = true; setMsg("عرض فقط، ما تقدر تضيف."); }
  col.onSnapshot(snap => {
    purchases = snap.docs.map(d => {
      const x = d.data();
      return { id: d.id, month: String(x.month), card: String(x.card),
        qty: Number(x.qty) || 0, buy: Number(x.buy) || 0, sell: x.sell == null ? null : Number(x.sell), at: String(x.at || "") };
    });
    $("conn").textContent = `محفوظ · ${purchases.length} عملية`;
    render();
  }, () => { $("conn").textContent = "انقطع الاتصال، حدّث الصفحة"; });
})();
</script>
